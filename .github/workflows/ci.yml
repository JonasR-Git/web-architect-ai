name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject critical dependency advisories
        run: npm run audit:critical

      - name: Typecheck
        run: npm run typecheck

      - name: Run focused tests
        run: npm test

      - name: Lint maintained core
        run: npm run lint:focused

      - name: Build
        run: npm run build
        env:
          USE_MOCK: 'true'
